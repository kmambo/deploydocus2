# yaml-language-server: $schema=https://squidfunk.github.io/mkdocs-material/schema.json
site_name: deploydocus
site_description:  Developer-friendly SDK for application deployment to Kubernetes clusters
strict: true
site_url: https://deploydocus.io/
theme:
  name: 'material'
  custom_dir: 'docs/theme'
  features:
    - content.tabs.link
    - content.code.annotate
    - content.code.copy
    - announce.dismiss
    - navigation.tabs
    - navigation.indexes
    - navigation.footer
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.preview
    - navigation.instant.progress
    - navigation.path
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.suggest
    - toc.follow
plugins:
- mkdocstrings:
    default_handler: python
    handlers:
      python:
        options:
          allow_inspection: true
          show_bases: true
          extensions:
            - griffe_sphinx
            - griffe_pydantic: { schema: true }
nav:
- Get Started:
  - Welcome to deploydocus2: index.md
  - Installation: install.md
  - Why deploydocus?: motivation.md
- Example:
  - A web application: example/webapp.md
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn
markdown_extensions:
- tables
- toc:
    permalink: true
    title: Page contents
- admonition
- pymdownx.details
- pymdownx.superfences
- pymdownx.highlight:
    pygments_lang_class: true
- pymdownx.extra
- pymdownx.emoji:
    emoji_index: !!python/name:material.extensions.emoji.twemoji
    emoji_generator: !!python/name:material.extensions.emoji.to_svg
- pymdownx.tabbed:
    alternate_style: true